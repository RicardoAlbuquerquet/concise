name: release

# A version bump on main is a release: tag it and publish the CHANGELOG
# section, so watchers get notified and every version has a pinnable ref.
# One job per plugin. The prefix keeps super-concise tags from colliding with
# the concise `v*` tags.
on:
  push:
    branches: [main]
    paths:
      - 'skills/concise/.claude-plugin/plugin.json'
      - 'skills/super-concise/.claude-plugin/plugin.json'

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - {plugin: concise, prefix: v, heading: '', latest: 'true'}
          - {plugin: super-concise, prefix: super-concise-v, heading: 'super-concise ', latest: 'false'}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: version
        run: |
          v=$(sed -n 's/.*"version": *"\([^"]*\)".*/\1/p' skills/${{ matrix.plugin }}/.claude-plugin/plugin.json)
          echo "value=$v" >> "$GITHUB_OUTPUT"
          if git rev-parse "${{ matrix.prefix }}$v" >/dev/null 2>&1; then
            echo "${{ matrix.prefix }}$v already tagged — nothing to release"
            echo "fresh=no" >> "$GITHUB_OUTPUT"
          else
            echo "fresh=yes" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.version.outputs.fresh == 'yes'
        name: Extract this version's changelog section
        run: |
          v='${{ steps.version.outputs.value }}'
          awk -v h='${{ matrix.heading }}' -v v="$v" '
            $0 ~ "^## " h v " " {f=1; next}
            f && /^## / {exit}
            f
          ' CHANGELOG.md > notes.md
          # An entry is required: a release with no notes tells nobody what it
          # brought, which is the rule the repo enforces on itself.
          [ -s notes.md ] || { echo "no CHANGELOG section for ${{ matrix.heading }}$v" >&2; exit 1; }
          cat notes.md

      - if: steps.version.outputs.fresh == 'yes'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v='${{ steps.version.outputs.value }}'
          t="${{ matrix.prefix }}$v"
          git tag "$t"
          git push origin "$t"
          gh release create "$t" --title "$t" --notes-file notes.md --latest=${{ matrix.latest }}
